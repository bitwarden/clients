@if (sideNavService.open()) {
  <div
    class="tw-relative tw-mx-2 tw-rounded-lg tw-border tw-border-solid tw-border-border-nav-divider tw-p-3 tw-text-sm tw-text-fg-nav-heading"
  >
    @if (isDismissible()) {
      <div class="tw-absolute tw-end-1 tw-top-1">
        <button
          type="button"
          bitIconButton="bwi-close"
          buttonType="side-nav"
          size="small"
          (click)="onDismiss()"
          [label]="'close' | i18n"
        ></button>
      </div>
    }
    <div [class.tw-pe-6]="isDismissible()">
      <ng-content></ng-content>
    </div>
  </div>
}
