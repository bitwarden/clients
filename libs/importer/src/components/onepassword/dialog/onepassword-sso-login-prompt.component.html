<bit-dialog [title]="'onePasswordSsoLogInTitle' | i18n" [subtitle]="data.email">
  <!-- disableClose hides the dialog's own close button. Like Cancel, this one calls the sign-in off. -->
  <button
    bitDialogHeaderEnd
    type="button"
    bitIconButton="bwi-close"
    buttonType="primaryGhost"
    size="default"
    [label]="'close' | i18n"
    id="onepassword-sso-login-prompt_button_close"
    (click)="cancel()"
  ></button>

  <div bitDialogContent class="tw-flex tw-flex-col tw-items-center tw-gap-4 tw-text-center">
    <bit-svg [content]="icon" class="tw-w-14"></bit-svg>
    <p bitTypography="body1" class="tw-mb-0">
      {{ "onePasswordSsoSwitchToSignInPage" | i18n }}
    </p>
  </div>

  <ng-container bitDialogFooter>
    <button
      bitButton
      buttonType="primary"
      type="button"
      id="onepassword-sso-login-prompt_button_open-browser"
      (click)="data.openWindow()"
    >
      <span>{{ "openBrowser" | i18n }}</span>
    </button>
    <button
      bitButton
      buttonType="secondary"
      type="button"
      id="onepassword-sso-login-prompt_button_cancel"
      (click)="cancel()"
    >
      <span>{{ "cancel" | i18n }}</span>
    </button>
  </ng-container>
</bit-dialog>
