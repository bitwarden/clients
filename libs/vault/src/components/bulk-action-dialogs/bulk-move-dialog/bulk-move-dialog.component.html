<form [formGroup]="formGroup" [bitSubmit]="submit" bit-dialog dialogSize="small">
  <span bitDialogTitle>
    {{ "addToFolder" | i18n }}
  </span>
  <span bitDialogContent>
    @if (!vfo1TerminologyService.enabled()) {
      <p>{{ "moveSelectedItemsDesc" | i18n: ciphers.length }}</p>
    }
    <bit-form-field>
      <bit-label>
        {{ (vfo1TerminologyService.enabled() ? "myFolder" : "selectFolder") | i18n }}
      </bit-label>
      <bit-select
        id="bulk-move-dialog_select_folder"
        formControlName="folderId"
        [placeholder]="'selectFolder' | i18n"
      >
        @for (f of folders(); track f.id) {
          <bit-option [value]="f.id" [label]="f.name" [disabled]="f.id === sharedFolderId">
          </bit-option>
        }
      </bit-select>
    </bit-form-field>
  </span>
  <ng-container bitDialogFooter>
    <button
      id="bulk-move-dialog_button_save"
      bitButton
      bitFormButton
      type="submit"
      buttonType="primary"
      [disabled]="saveDisabled()"
    >
      {{ "save" | i18n }}
    </button>
    <button
      id="bulk-move-dialog_button_cancel"
      bitButton
      bitFormButton
      type="button"
      buttonType="secondary"
      (click)="cancel()"
    >
      {{ "cancel" | i18n }}
    </button>
  </ng-container>
</form>
