@if (node().children.length > 0) {
  <!-- The row navigates; only the chevron toggles the folders beneath it. -->
  <bit-nav-group
    bitHoverRevealContainer
    icon="bwi-shared-folder"
    [text]="node().name"
    [route]="route()"
    [disableToggleOnClick]="true"
    [forceActiveStyles]="active()"
  >
    <div slot="end" bitHoverReveal>
      <ng-container *ngTemplateOutlet="options" />
    </div>
    @for (child of node().children; track child.id) {
      <vault-pinned-nav-node [node]="child" [routes]="routes()" />
    }
  </bit-nav-group>
} @else {
  <bit-nav-item
    bitHoverRevealContainer
    icon="bwi-shared-folder"
    [text]="node().name"
    [route]="route()"
  >
    <div slot="end" bitHoverReveal>
      <ng-container *ngTemplateOutlet="options" />
    </div>
  </bit-nav-item>
}

<ng-template #options>
  <button
    type="button"
    bitIconButton="bwi-ellipsis-h"
    buttonType="side-nav"
    size="xsmall"
    [label]="'optionsForItem' | i18n: node().name"
    [bitMenuTriggerFor]="menu"
  ></button>
  <bit-menu #menu>
    <button
      type="button"
      bitMenuItem
      [attr.id]="'vault-pinned-nav_menu-item_unpin-' + node().id"
      (click)="unpin()"
    >
      <bit-icon slot="start" fixedWidth name="bwi-unpin" />
      {{ "unpinFromSidebar" | i18n }}
    </button>
  </bit-menu>
</ng-template>
