<popup-page>
  <popup-header slot="header" [pageTitle]="'health' | i18n">
    <ng-container slot="end">
      <app-pop-out />
      <app-current-account />
    </ng-container>
  </popup-header>
  @if (!hasRunHealthScan()) {
    <health-intro (onTriggerHealthScan)="handleHealthScan()" />
  } @else {
    <div>
      <!-- TODO: REMOVE BUTTONS. FOR TEMPORARY TESTING. -->
      <button
        class="tw-block"
        type="button"
        (click)="routeToCategory('exposedPasswordsTitle', 'exposedPasswordsDescription')"
      >
        Go to exposed passwords
      </button>
      <button
        class="tw-block"
        type="button"
        (click)="routeToCategory('weakPasswordsTitle', 'weakPasswordsDescription')"
      >
        Go to weak passwords
      </button>
      <button
        class="tw-block"
        type="button"
        (click)="routeToCategory('reusedPasswordsTitle', 'reusedPasswordsDescription')"
      >
        Go to reused passwords
      </button>
      <!-- END TODO -->
    </div>
  }
</popup-page>
