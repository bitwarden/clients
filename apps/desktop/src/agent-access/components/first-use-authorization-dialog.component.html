<form [bitSubmit]="submit" [formGroup]="firstUseAuthorizationForm">
  <app-agent-access-request-dialog
    [dialogTitle]="'agentAccessFirstUseTitle' | i18n"
    [requester]="requesterView()"
    [grade]="AgentAccessConsequence.Change"
    [consequenceSummary]="'agentAccessFirstUseConsequenceSummary' | i18n"
    [consequenceDetail]="'agentAccessFirstUseConsequenceDetail' | i18n"
  >
    <!-- A path-only descriptor is a weaker identity guarantee than a verified signature — call
         that out even when nothing failed verification (there was simply nothing to verify). -->
    @if (descriptorKind() === "path") {
      <p class="tw-m-0 tw-text-muted" bitTypography="helper">
        {{ "agentAccessFirstUseWeakerGuaranteeNote" | i18n }}
      </p>
    }

    <bit-form-control-group [block]="true" formControlName="scope">
      <bit-label>{{ "agentAccessFirstUseScope" | i18n }}</bit-label>

      <bit-form-control-card>
        <input
          id="first-use-authorization-dialog_radio_scope-all-logins"
          type="radio"
          bitRadio
          [value]="AgentAccessGrantScope.AllLogins"
        />
        <bit-label>{{ "agentAccessFirstUseScopeAllLogins" | i18n }}</bit-label>
        <bit-hint>{{ "agentAccessFirstUseScopeAllLoginsHint" | i18n }}</bit-hint>
      </bit-form-control-card>
    </bit-form-control-group>

    <div footnote class="tw-flex tw-flex-col tw-gap-2 tw-text-muted">
      <p class="tw-m-0" bitTypography="helper">{{ "agentAccessFirstUseCaveat" | i18n }}</p>
    </div>

    <ng-container dialogFooter>
      <button
        id="first-use-authorization-dialog_button_authorize"
        type="submit"
        bitButton
        bitFormButton
        buttonType="primary"
        [disabled]="firstUseAuthorizationForm.invalid"
      >
        <span>{{ "authorize" | i18n }}</span>
      </button>
      <button
        id="first-use-authorization-dialog_button_deny"
        type="button"
        bitButton
        bitFormButton
        buttonType="secondary"
        (click)="deny()"
      >
        {{ "deny" | i18n }}
      </button>
    </ng-container>
  </app-agent-access-request-dialog>
</form>
