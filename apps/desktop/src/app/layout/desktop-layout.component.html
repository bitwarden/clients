<bit-layout class="!tw-h-full">
  <app-side-nav slot="side-nav">
    <bit-nav-logo [openIcon]="logo" route="." [label]="'passwordManager' | i18n" />

    @if (vfo1Foundation()) {
      <vault-nav-section />

      <bit-nav-section [label]="'tools' | i18n">
        @if (sendEnabled()) {
          <app-send-filters-nav />
        }
        <bit-nav-item
          icon="bwi-generate"
          [text]="'generator' | i18n"
          (mainContentClicked)="openGenerator()"
        />
        <bit-nav-item
          icon="bwi-import"
          [text]="'importNoun' | i18n"
          (mainContentClicked)="openImport()"
        />
        <bit-nav-item
          icon="bwi-download"
          [text]="'exportNoun' | i18n"
          (mainContentClicked)="openExport()"
        />
      </bit-nav-section>

      <bit-nav-section [label]="'manage' | i18n">
        <vault-manage-nav />
      </bit-nav-section>
    } @else {
      <app-vault-filter />
      @if (sendEnabled()) {
        <app-send-filters-nav />
      }

      <bit-nav-item icon="bwi-generate" [text]="'generator' | i18n" (click)="openGenerator()" />
      <bit-nav-item icon="bwi-import" [text]="'importNoun' | i18n" (click)="openImport()" />
      <bit-nav-item icon="bwi-download" [text]="'exportNoun' | i18n" (click)="openExport()" />
    }
  </app-side-nav>

  <router-outlet></router-outlet>
</bit-layout>
