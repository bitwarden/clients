<div class="tw-m-4 tw-p-4">
  <!-- Header stays full width, matching other desktop pages (e.g. send.component.html) — only the
       picker's own content is capped, so it doesn't inherit the header's full-width treatment. -->
  <app-header></app-header>
  <div class="tw-max-w-6xl">
    <p bitTypography="h5" noMargin class="tw-mb-2 !tw-text-fg-heading">{{ headingKey() | i18n }}</p>

    <bit-progress-bar
      [hideStartHint]="true"
      [value]="progressValue()"
      [accessibleName]="stepText()"
      [ariaValueText]="stepText()"
    ></bit-progress-bar>
    <p
      bitTypography="helper"
      noMargin
      aria-hidden="true"
      class="tw-mt-1 tw-mb-4 tw-text-fg-body-subtle"
    >
      {{ stepText() }}
    </p>

    <router-outlet></router-outlet>
  </div>
</div>
