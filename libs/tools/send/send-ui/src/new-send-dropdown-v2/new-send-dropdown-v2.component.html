@if (allowedSendTypes().length === 1) {
  <button bitButton [buttonType]="buttonType()" type="button" (click)="onRestrictedClick()">
    @if (!hideIcon()) {
      <bit-icon name="bwi-plus" class="tw-me-2" />
    }
    {{ (hideIcon() ? "createSendV2" : "create") | i18n }}
  </button>
} @else {
  <button bitButton [bitMenuTriggerFor]="itemOptions" [buttonType]="buttonType()" type="button">
    @if (!hideIcon()) {
      <bit-icon name="bwi-plus" class="tw-me-2" />
    }
    {{ (hideIcon() ? "createSendV2" : "create") | i18n }}
  </button>
  <bit-menu #itemOptions>
    <button bitMenuItem type="button" (click)="onTextSendClick()">
      <bit-icon name="bwi-file-text" slot="start" />
      {{ "sendTypeText" | i18n }}
    </button>
    <button bitMenuItem type="button" (click)="onFileSendClick()">
      <div class="tw-flex tw-items-center tw-gap-2">
        <bit-icon name="bwi-file" slot="start" />
        {{ "sendTypeFile" | i18n }}
        <app-premium-badge></app-premium-badge>
      </div>
    </button>
  </bit-menu>
}
