  - tsconfig.base.json
  - nx.json

  ## Overrides
  # For the time being platform owns tsconfig and jest config
  # These overrides will be removed after Nx is implemented
  # To track that effort please see https://bitwarden.atlassian.net/browse/PM-21636
  - "**/tsconfig.json"
  - "**/jest.config.js"
  - "**/project.json"

  # Platform override specifically for the package-lock.json in
  # native-messaging-test-runner so that Platform can manage all lock file updates
  - apps/desktop/native-messaging-test-runner/package-lock.json

  # Claude related files
  - .github/workflows/sdlc-sdk-update-evaluate.yml
