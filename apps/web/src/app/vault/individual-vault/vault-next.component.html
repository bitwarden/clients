<app-header [title]="title()">
  @if (collectionSelected()) {
    <bit-breadcrumbs slot="breadcrumbs">
      <bit-breadcrumb [route]="orgRootRoute()">
        <bit-icon-tile
          slot="start"
          [icon]="orgTile()?.icon"
          [variant]="orgTile()?.variant ?? 'primary'"
          [emphasis]="orgTile()?.emphasis ?? 'subtle'"
        />
        {{ orgNavItem()?.label }}
      </bit-breadcrumb>
      <bit-breadcrumb [icon]="'bwi-list-alt'" [route]="orgRootRoute()">
        {{ "collections" | vfo1I18n: "sharedFolders" }}
      </bit-breadcrumb>
      @for (crumb of collectionBreadcrumbs(); track crumb.id) {
        <bit-breadcrumb [icon]="'bwi-shared-folder'" [route]="sharedFolderRoute(crumb)">
          {{ crumb.name }}
        </bit-breadcrumb>
      }
      <!-- @for forces BreadcrumbComponent to recreate on folder change so ngOnInit re-checks the active route -->
      @for (id of [collectionIdParam()]; track id) {
        <bit-breadcrumb
          [icon]="'bwi-shared-folder'"
          [route]="currentFolderRoute()"
          queryParamsHandling="preserve"
        >
          {{ sharedFolderName() }}
        </bit-breadcrumb>
      }
    </bit-breadcrumbs>
  }
</app-header>

<vault-organization-user-notifications></vault-organization-user-notifications>
<app-vault-banners [organizations]="organizations()"></app-vault-banners>

<app-vault-onboarding [ciphers]="activeCiphers()"></app-vault-onboarding>

<vault-shared-folder-card-grid
  [collections]="scopedCollections()"
  [scope]="vaultScope()"
></vault-shared-folder-card-grid>

<vault-items-table
  [ciphers]="ciphers()"
  [loading]="loading()"
  [rowActions]="rowActions()"
  [folders]="folders()"
  [collections]="scopedCollections()"
  [organizations]="scopedOrganizations()"
  [scopedOrganizationId]="scopedOrganizationId()"
  [orgRequiresDataOwnership]="orgRequiresDataOwnership()"
  [itemAction]="itemAction"
  [copyPresentation]="copyPresentation()"
>
  <div slot="toolbar" class="tw-flex tw-items-center tw-gap-3">
    @if (showItemCreation()) {
      <button
        id="vault-next_button_import"
        type="button"
        bitButton
        startIcon="bwi-download"
        buttonType="secondary"
        (click)="openImportDialog()"
      >
        {{ "importNoun" | i18n }}
      </button>
      <vault-new-cipher-menu
        [canCreateCipher]="true"
        [canCreateSshKey]="true"
        (cipherAdded)="addCipher($event)"
        (onAddItemDialog)="openAddItemDialog()"
      />
    }
  </div>
</vault-items-table>
