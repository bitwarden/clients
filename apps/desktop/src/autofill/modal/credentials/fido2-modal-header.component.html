@if (vfo1Enabled()) {
  <header class="tw-app-region-drag">
    <div data-testid="app-bar" class="tw-bg-bg-nav tw-text-fg-nav tw-py-2 tw-px-4">
      <div class="tw-flex tw-w-full tw-items-center tw-justify-between tw-gap-2">
        <bit-svg
          class="tw-block tw-w-[120px] [&_path]:tw-fill-fg-nav"
          [content]="logo"
          [ariaLabel]="'appLogoLabel' | i18n"
        ></bit-svg>
        <button
          type="button"
          bitIconButton="bwi-close"
          buttonType="side-nav"
          size="small"
          class="tw-app-region-no-drag"
          (click)="closeModal.emit()"
          [label]="'close' | i18n"
        ></button>
      </div>
    </div>
    <div
      data-testid="title-bar"
      class="tw-bg-bg-tertiary tw-p-3 tw-border-0 tw-border-b tw-border-solid tw-border-border-base"
    >
      <h1 bitTypography="h5" class="!tw-mb-0">{{ pageTitle() }}</h1>
    </div>
  </header>
} @else {
  <bit-section
    disableMargin
    class="tw-border-0 tw-border-b tw-border-solid tw-border-secondary-300"
  >
    <bit-section-header class="tw-app-region-drag tw-bg-background">
      <div class="tw-flex tw-items-center tw-pl-4">
        <h2 class="tw-font-semibold tw-text-lg">{{ pageTitle() }}</h2>
      </div>
      <button
        type="button"
        bitIconButton="bwi-close"
        slot="end"
        class="tw-app-region-no-drag tw-mr-2"
        (click)="closeModal.emit()"
        [label]="'close' | i18n"
      ></button>
    </bit-section-header>
  </bit-section>
}
