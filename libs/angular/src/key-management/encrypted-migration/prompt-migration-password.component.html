<form
  [bitSubmit]="submit"
  [formGroup]="migrationPasswordForm"
  bit-dialog
  [title]="'updateEncryptionSettings' | i18n"
>
  <div bitDialogContent>
    <div class="tw-flex tw-flex-col tw-items-center tw-text-center tw-mb-6">
      <bit-svg [content]="lockIcon" class="tw-w-24 tw-mb-4"></bit-svg>
      <p class="tw-mb-0">
        {{ "updateEncryptionSettingsPromptDesc" | i18n }}
        <a
          bitLink
          href="https://bitwarden.com/help/kdf-algorithms/"
          target="_blank"
          rel="noreferrer"
          aria-label="external link"
          endIcon="bwi-external-link"
        >
          {{ "learnMore" | i18n }}
        </a>
      </p>
    </div>
    <bit-form-field disableMargin>
      <bit-label>{{ "masterPass" | i18n }}</bit-label>
      <input
        id="prompt-migration-password_input_master-password"
        class="tw-font-mono"
        bitInput
        type="password"
        formControlName="masterPassword"
        [attr.title]="'masterPass' | i18n"
      />
      <button
        id="prompt-migration-password_button_toggle-visibility"
        type="button"
        bitIconButton
        bitSuffix
        bitPasswordInputToggle
        [attr.title]="'toggleVisibility' | i18n"
        [attr.aria-label]="'toggleVisibility' | i18n"
      ></button>
    </bit-form-field>
  </div>
  <ng-container bitDialogFooter>
    <button
      id="prompt-migration-password_button_continue"
      type="submit"
      bitButton
      bitFormButton
      buttonType="primary"
      [disabled]="migrationPasswordForm.invalid"
    >
      <span>{{ "continue" | i18n }}</span>
    </button>
    <button
      id="prompt-migration-password_button_skip-for-now"
      type="button"
      bitLink
      linkType="primary"
      bitDialogClose
    >
      {{ "skipForNow" | i18n }}
    </button>
  </ng-container>
</form>
