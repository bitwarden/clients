<popup-page [disablePadding]="true">
  <!-- The hero titles these pages, so the title bar would be empty. -->
  <popup-header
    slot="header"
    hideTitleBar
    [background]="'alt'"
    [showBackButton]="state().showBackButton"
    [pageTitle]="''"
  >
    <div class="tw-w-32">
      @if (state().showLogo) {
        <bit-svg [content]="logo" [ariaLabel]="'appLogoLabel' | i18n"></bit-svg>
      }
    </div>

    <ng-container slot="end">
      <app-pop-out></app-pop-out>
      @if (state().showAcctSwitcher && hasLoggedInAccount()) {
        <app-current-account></app-current-account>
      }
    </ng-container>
  </popup-header>

  <!-- The landing pieces paint their own background; clear it so the page's shows through. -->
  <auth-anon-layout
    class="[&_bit-landing-header>header]:tw-bg-transparent [&_bit-landing-content>div]:tw-bg-transparent [&_bit-landing-footer>footer]:tw-bg-transparent"
    [title]="state().pageTitle"
    [subtitle]="state().pageSubtitle"
    [icon]="state().pageIcon"
    [showReadonlyHostname]="state().showReadonlyHostname"
    [hideLogo]="true"
    [maxWidth]="state().maxWidth"
    [hideFooter]="state().hideFooter"
    [hideCardWrapper]="state().hideCardWrapper"
    [hidePageIcon]="state().hidePageIcon"
    [contentVerticalPadding]="state().contentVerticalPadding"
    [footerVerticalPadding]="state().footerVerticalPadding"
    [heroTextAlignment]="state().heroTextAlignment"
    [secondaryContentLocation]="state().secondaryContentLocation"
  >
    <router-outlet></router-outlet>
    <!-- The shared layout exposes two distinct slot selectors. We pick which one -->
    <!-- to project into based on the route-level secondaryContentLocation flag. -->
    @if (state().secondaryContentLocation === "footer") {
      <router-outlet slot="footer-secondary" name="secondary"></router-outlet>
    } @else {
      <router-outlet slot="secondary" name="secondary"></router-outlet>
    }
    <router-outlet slot="environment-selector" name="environment-selector"></router-outlet>
  </auth-anon-layout>
</popup-page>
