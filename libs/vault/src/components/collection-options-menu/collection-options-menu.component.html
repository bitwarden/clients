@if (showMenu()) {
  <button
    type="button"
    [bitIconButton]="triggerIcon()"
    size="small"
    [bitMenuTriggerFor]="menu"
    [label]="'optionsForItem' | i18n: collection().name"
    [attr.id]="idPrefix() + '_button_options-' + collection().id"
  ></button>
  <bit-menu #menu>
    <!-- First, and independent of what the member may edit or delete: anyone who can see a folder
         can pin it. -->
    @if (showPinAction()) {
      <button
        type="button"
        bitMenuItem
        [attr.id]="idPrefix() + '_menu-item_pin-' + collection().id"
        (click)="togglePin()"
      >
        <bit-icon slot="start" fixedWidth [name]="isPinned() ? 'bwi-unpin' : 'bwi-pin'" />
        {{ (isPinned() ? "unpinFromSidebar" : "pinToSidebar") | i18n }}
      </button>
    }
    @if (showEditActions()) {
      <button
        type="button"
        bitMenuItem
        [attr.id]="idPrefix() + '_menu-item_edit-' + collection().id"
        (click)="editCollection(CollectionDialogTab.Info)"
      >
        <bit-icon slot="start" fixedWidth name="bwi-pencil-square" />
        {{ "editInfo" | i18n }}
      </button>
      <button
        type="button"
        bitMenuItem
        [attr.id]="idPrefix() + '_menu-item_access-' + collection().id"
        (click)="editCollection(CollectionDialogTab.Access)"
      >
        <bit-icon slot="start" fixedWidth name="bwi-users" />
        {{ "editAccess" | i18n }}
      </button>
    }
    @if (showDeleteAction()) {
      <button
        type="button"
        bitMenuItem
        variant="danger"
        [attr.id]="idPrefix() + '_menu-item_delete-' + collection().id"
        (click)="delete()"
      >
        <bit-icon slot="start" fixedWidth name="bwi-trash" />
        {{ "delete" | i18n }}
      </button>
    }
  </bit-menu>
}
