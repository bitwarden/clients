<form
  [formGroup]="formGroup"
  [bitSubmit]="submit"
  bit-dialog
  [title]="'onePasswordSsoApproveDeviceTitle' | i18n"
  [subtitle]="data.email"
>
  <!-- disableClose hides the dialog's own close button. Like Cancel, this one waits out the enrollment. -->
  <button
    bitDialogHeaderEnd
    type="button"
    bitIconButton="bwi-close"
    buttonType="primaryGhost"
    size="default"
    [label]="'close' | i18n"
    id="onepassword-sso-enrollment-prompt_button_close"
    bitFormButton
    (click)="cancel()"
  ></button>

  <div bitDialogContent>
    <p bitTypography="body1">{{ statusMessageKey() | i18n }}</p>
    @if (askingForCode()) {
      <bit-form-field disableMargin>
        <bit-label>{{ "verificationCode" | i18n }}</bit-label>
        <input
          bitInput
          type="text"
          id="onepassword-sso-enrollment-prompt_input_code"
          formControlName="code"
          autocomplete="one-time-code"
          appAutofocus
          appInputVerbatim
          appInputStripSpaces
        />
      </bit-form-field>
    }
  </div>

  <ng-container bitDialogFooter>
    @if (data.codeRequested()) {
      <button
        bitButton
        buttonType="primary"
        type="submit"
        id="onepassword-sso-enrollment-prompt_button_continue"
        bitFormButton
      >
        <span>{{ "continue" | i18n }}</span>
      </button>
    }
    <button
      bitButton
      buttonType="secondary"
      type="button"
      id="onepassword-sso-enrollment-prompt_button_cancel"
      bitFormButton
      (click)="cancel()"
    >
      <span>{{ "cancel" | i18n }}</span>
    </button>
  </ng-container>
</form>
