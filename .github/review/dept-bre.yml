# Owner review list for @bitwarden/dept-bre
#
# Review is required from the owning team for any change to a file that matches include
# and doesn't match exclude. Patterns use CODEOWNERS syntax. The list applies only to files
# CODEOWNERS assigns to this team.
#
# Seeded from CODEOWNERS. The team removes paths through PRs as it comes to trust change-kind routing.

include:
  ## BRE team owns these workflows ##
  - .github/workflows/retrieve-current-desktop-rollout.yml
  - .github/workflows/version-auto-bump-desktop.yml
  - .github/workflows/version-auto-bump-desktop-signal.yml
  - .github/workflows/publish-cli.yml

  ## Docker-related files
  - "**/Dockerfile"
  - "**/*.Dockerfile"
  - "**/*.dockerignore"
  - "**/docker-compose.yml"
  - "**/entrypoint.sh"
