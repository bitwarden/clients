name: BitwardenAutofillExtension
options:
  ccache: true
  postGenCommand: |
    TARGET_DIR="BitwardenAutofillExtension.xcodeproj/project.xcworkspace/xcshareddata"
    mkdir -p $TARGET_DIR
    private_dir=${BITWARDEN_BUILD_DIR}/apps/desktop/macos/BitwardenMacosAutofillExtension.p
    cat <<EOF > "$TARGET_DIR/WorkspaceSettings.xcsettings"
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>IDEWorkspaceSharedSettings_DerivedDataLocationStyle</key>
        <integer>2</integer>
        <key>IDEWorkspaceSharedSettings_DerivedDataCustomLocation</key>
        <string>$private_dir</string>
    </dict>
    </plist>
    EOF

    echo "✅ Dynamically injected WorkspaceSettings into project container pointing to: $private_dir"

include:
  - path: project-common.yml
fileGroups:
  - Configs
configs:
  Debug: debug
  Release: release

schemes:
  BitwardenAutofillExtension:
    build:
      targets:
        BitwardenAutofillExtension: all
      preActions:
        - name: "Compile Autofill Provider Library"
          env:
            BITWARDEN_BUILD_DIR: ${BITWARDEN_BUILD_DIR}
          script: |
            set -e
            ${NODE_BIN} ${DESKTOP_PROJECT_DIR}/desktop_native/autofill_provider/build-macos-lib.mts --build-dir ${BITWARDEN_BUILD_DIR}

targets:
  BitwardenAutofillExtension:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Configs/BitwardenAutofillExtension-Debug.xcconfig
      Release: Configs/BitwardenAutofillExtension-Release.xcconfig
    settings:
      base:
        ARCHS: ${ARCHS}
        MACOS_DEPLOYMENT_TARGET: "14.2"
        ENABLE_HARDENED_RUNTIME: YES

        # App Identity
        DEVELOPMENT_TEAM: "${BITWARDEN_APPLE_TEAM_ID}"
        PRODUCT_BUNDLE_IDENTIFIER: ${BITWARDEN_AUTOFILL_EXTENSION_APP_ID}
        INFOPLIST_KEY_CFBundleDisplayName: ${BITWARDEN_PRODUCT_NAME}
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"

        # Signing
        CODE_SIGN_ENTITLEMENTS: "${BITWARDEN_BUILD_DIR}/apps/desktop/macos/BitwardenMacosAutofillExtension.p/autofill-extension.entitlements"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "${BITWARDEN_CODE_SIGN_IDENTITY}"
        PROVISIONING_PROFILE_SPECIFIER: ${BITWARDEN_PROVISIONING_PROFILE_SPECIFIER}

        # The checked-in autofill-extension/Info.plist belongs to the legacy desktop.xcodeproj;
        # this project uses its own copy so the two can coexist until the new build is accepted.
        INFOPLIST_FILE: autofill-extension/Application/Support/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    sources:
      - path: autofill-extension
        excludes:
          - "**/Info.plist"
          - "BitwardenMacosProvider.swift"
      - path: ${BITWARDEN_BUILD_DIR}/apps/desktop/desktop_native/autofill_provider/BitwardenMacosProvider/Sources/BitwardenMacosProvider
        type: group
    dependencies:
      - framework: ${BITWARDEN_BUILD_DIR}/apps/desktop/desktop_native/autofill_provider/BitwardenMacosProvider/Frameworks/BitwardenMacosProviderFFI.xcframework
        embed: false
