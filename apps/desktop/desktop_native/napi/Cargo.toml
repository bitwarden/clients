[package]
name = "desktop_napi"
exclude = ["index.node"]
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = { workspace = true }

[lib]
crate-type = ["cdylib"]

[features]
default = []
manual_test = []

[dependencies]
anyhow = { workspace = true }
# Renamed on import: this crate's own napi submodule is also named `agent_access` (to match
# the generated `agentAccess` TS namespace), so the dependency is aliased here to avoid a name
# collision between the crate and the submodule.
agent_access_core = { package = "agent_access", path = "../agent_access" }
async-trait = { workspace = true }
autofill_provider = { path = "../autofill_provider", features = ["napi"] }
autotype = { path = "../autotype" }
biometric = { path = "../biometric" }
chromium_importer = { path = "../chromium_importer" }
desktop_core = { path = "../core" }
napi = { workspace = true, features = ["async", "anyhow"] }
napi-derive = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ssh_agent = { path = "../ssh_agent" }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Wraps the `secretValue` DTO field (agent_access.rs) so it's scrubbed on drop before handing it
# to `agent_access_core::CredentialResponseData::secret_value`. Pinned to match
# `agent_access`'s own direct pin (not a [workspace.dependencies] entry there either).
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-registry = { workspace = true }
windows_plugin_authenticator = { path = "../windows_plugin_authenticator" }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
