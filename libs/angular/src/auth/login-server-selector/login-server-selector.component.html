<div class="tw-flex tw-items-center tw-gap-1 tw-text-xs tw-leading-4 tw-text-fg-body">
  <span>{{ "loggingInOn" | i18n }}</span>
  <button
    type="button"
    bitLink
    #trigger="menuTrigger"
    [bitMenuTriggerFor]="serverMenu"
    [endIcon]="trigger.isOpen() ? 'bwi-angle-up' : 'bwi-angle-down'"
    data-testid="login-server-selector-trigger"
  >
    {{ selectedRegion()?.domain ?? ("selfHostedServer" | i18n) }}
  </button>
</div>

<bit-menu #serverMenu>
  @for (region of availableRegions(); track region.key) {
    <button
      type="button"
      bitMenuItem
      [attr.aria-pressed]="selectedRegion()?.key === region.key"
      (click)="selectRegion(region.key)"
    >
      <bit-icon
        name="bwi-check"
        class="bwi-fw bwi-sm"
        [style.visibility]="selectedRegion()?.key === region.key ? 'visible' : 'hidden'"
      ></bit-icon>
      <span>{{ region.domain }}</span>
    </button>
  }
  <button
    type="button"
    bitMenuItem
    [attr.aria-pressed]="!selectedRegion()"
    (click)="selectSelfHosted()"
  >
    <bit-icon
      name="bwi-check"
      class="bwi-fw bwi-sm"
      [style.visibility]="selectedRegion() ? 'hidden' : 'visible'"
    ></bit-icon>
    <span>{{ "selfHostedServer" | i18n }}</span>
  </button>
</bit-menu>
