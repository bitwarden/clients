<form
  [bitSubmit]="submit"
  [formGroup]="approveSshRequestForm"
  bit-dialog
  data-testid="ssh-approval-dialog"
>
  <div class="tw-font-medium" bitDialogTitle>{{ "sshkeyApprovalTitle" | i18n }}</div>
  <div bitDialogContent>
    @if (params.isAgentForwarding) {
    <bit-callout
      type="warning"
      title="{{ 'agentForwardingWarningTitle' | i18n }}"
      data-testid="ssh-approval-forwarding-warning"
    >
      {{ 'agentForwardingWarningText' | i18n }}
    </bit-callout>
    }

    <b>{{params.applicationName}}</b> {{ "sshkeyApprovalMessageInfix" | i18n }}
    <b>{{params.cipherName}}</b>
    {{ "sshkeyApprovalMessageSuffix" | i18n }} {{ params.action | i18n }}
  </div>
  <ng-container bitDialogFooter>
    <button
      type="submit"
      bitButton
      bitFormButton
      buttonType="primary"
      data-testid="ssh-approval-authorize-button"
    >
      <span>{{ "authorize" | i18n }}</span>
    </button>
    <button
      type="button"
      bitButton
      bitFormButton
      buttonType="secondary"
      bitDialogClose
      data-testid="ssh-approval-deny-button"
    >
      {{ "deny" | i18n }}
    </button>
  </ng-container>
</form>
