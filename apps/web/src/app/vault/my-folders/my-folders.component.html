<app-header></app-header>

<bit-table-v2 [tableDef]="table" [filter]="filter" [selection]="selection" [loading]="loading()">
  <bit-table-toolbar>
    <bit-search
      id="my-folders_input_search"
      class="tw-flex-1"
      [placeholder]="'search' | i18n"
      [attr.aria-label]="'search' | i18n"
    ></bit-search>
    <button
      bitButton
      type="button"
      buttonType="primary"
      startIcon="bwi-plus"
      slot="end"
      id="my-folders_button_add-folder"
      (click)="addFolder()"
    >
      {{ "addFolder" | i18n }}
    </button>
  </bit-table-toolbar>

  <bit-bulk-actions-bar>
    <bit-bulk-action
      [action]="deleteSelected"
      icon="bwi-trash"
      [label]="'delete' | i18n"
    ></bit-bulk-action>
  </bit-bulk-actions-bar>

  <bit-column sortable defaultSort="asc">
    <bit-header-cell>{{ "name" | i18n }}</bit-header-cell>
    <bit-cell *bitCellDef="table.columns.name; let row">
      <span class="tw-truncate">{{ row.displayName }}</span>
    </bit-cell>
  </bit-column>

  <bit-column sortable width="120px">
    <bit-header-cell>{{ "items" | i18n }}</bit-header-cell>
    <bit-cell *bitCellDef="table.columns.itemCount; let row">{{ row.itemCount }}</bit-cell>
  </bit-column>

  <bit-column width="120px">
    <bit-header-cell>{{ "options" | i18n }}</bit-header-cell>
    <bit-cell *bitCellDef="table.columns.options; let row">
      <button
        type="button"
        bitIconButton="bwi-pencil-square"
        size="small"
        [id]="'my-folders_button_edit-' + row.id"
        [label]="'edit' | i18n"
        (click)="editFolder(row)"
      ></button>
      <button
        type="button"
        bitIconButton="bwi-trash"
        buttonType="danger"
        size="small"
        [id]="'my-folders_button_delete-' + row.id"
        [label]="'delete' | i18n"
        (click)="deleteFolder(row)"
      ></button>
    </bit-cell>
  </bit-column>
</bit-table-v2>
