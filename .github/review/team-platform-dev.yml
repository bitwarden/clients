# Owner review list for @bitwarden/team-platform-dev
#
# Review is required from the owning team for any change to a file that matches include
# and doesn't match exclude. Patterns use CODEOWNERS syntax. The list applies only to files
# CODEOWNERS assigns to this team.
#
# Seeded from CODEOWNERS. The team removes paths through PRs as it comes to trust change-kind routing.

include:
  ## Desktop native module ##
  - apps/desktop/desktop_native

  # Web connectors
  - apps/web/src/connectors/platform

  ## Localization/Crowdin (Platform team)
