<bit-dialog [title]="'importSuccessful' | i18n">
  <div bitDialogContent>
    <importer-confirmation-summary
      [summary]="data.summary"
      [fileName]="data.fileName"
      [showHeading]="false"
    />
  </div>

  <ng-container bitDialogFooter>
    <button
      type="button"
      bitButton
      bitDialogClose
      buttonType="primary"
      id="import-confirmation-dialog_button_view-items"
    >
      {{ "viewImportedItems" | i18n }}
    </button>
  </ng-container>
</bit-dialog>
