<!--
  Each slot is declared exactly once. A `select` repeated across branches of a control flow block
  would bind all matching content to whichever copy comes first, leaving the other branch empty.
-->
@if (vfo1Enabled()) {
  <div
    data-testid="app-bar"
    class="tw-bg-bg-nav tw-text-fg-nav tw-py-3 bit-compact:tw-py-2 tw-px-4 bit-compact:tw-px-3"
  >
    <div
      class="tw-max-w-screen-sm tw-mx-auto tw-flex tw-w-full tw-items-center tw-justify-between tw-gap-2 tw-h-9"
    >
      <div class="tw-inline-flex tw-items-center tw-gap-2">
        <bit-svg
          class="tw-block tw-w-28 [&_path]:tw-fill-fg-nav"
          [content]="logo"
          [ariaLabel]="'appLogoLabel' | i18n"
        ></bit-svg>
      </div>
      <!--
        The app bar is dark, so buttons projected here need `buttonType="side-nav"` to be legible
        against it. The bar deliberately does not force a foreground onto them, so that each caller
        keeps control of its own button styling.
      -->
      <div class="tw-inline-flex tw-items-center tw-gap-2">
        <ng-content select="[slot=app-actions]"></ng-content>
      </div>
    </div>
  </div>
}

<!--
  `tw-max-h-24` is a ceiling above the bar's natural height, not a fixed size — collapsing animates
  `max-height` so the expanded bar keeps whatever height its content needs. The padding collapses
  alongside it so visible motion starts on the first frame.
-->
<header
  class="tw-p-3 bit-compact:tw-p-2 tw-max-h-24 tw-overflow-hidden tw-bg-bg-tertiary tw-border-0 tw-border-b tw-border-solid tw-border-border-base motion-safe:tw-transition-all tw-duration-200 tw-ease-out"
  [class]="headerClasses()"
>
  <div class="tw-max-w-screen-sm tw-mx-auto tw-flex tw-justify-between tw-w-full">
    <div class="tw-inline-flex tw-items-center tw-gap-2">
      @if (showBackButton()) {
        <button
          bitIconButton="bwi-angle-left"
          type="button"
          [label]="'back' | i18n"
          [bitAction]="backAction()"
        ></button>
      }
      @if (vfo1Enabled()) {
        <ng-content select="[slot=start]"></ng-content>
      }
      @if (pageTitle()) {
        <h1 bitTypography="h3" class="!tw-mb-0">
          {{ pageTitle() }}
        </h1>
      }
      @if (!vfo1Enabled() || !pageTitle()) {
        <ng-content></ng-content>
      }
    </div>
    <div class="tw-flex tw-items-center tw-gap-2">
      <ng-content select="[slot=end]"></ng-content>
    </div>
  </div>
</header>
