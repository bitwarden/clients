<div class="tw-m-4 tw-p-4">
  <app-header>
    @if (!disableSend() && !vfo1Foundation()) {
      <tools-new-send-dropdown-v2 buttonType="primary" (addSend)="addSend($event)" />
    }
  </app-header>

  <!-- The V2 table component handles filtering, sorting, and the empty state itself
   so the intermediate send-list component is no longer required -->
  @if (vfo1Foundation()) {
    <tools-send-table-v2
      [sends]="allSends()"
      [disableSend]="disableSend()"
      (editSend)="onEditSend($event)"
      (copySend)="onCopySend($event)"
      (removeAuth)="onRemoveAuth($event)"
      (deleteSend)="onDeleteSend($event)"
      (addSend)="addSend($event)"
    />
  } @else {
    <tools-send-list
      [sends]="filteredSends()"
      [loading]="loading()"
      [disableSend]="disableSend()"
      [listState]="listState()"
      [searchText]="currentSearchText()"
      (editSend)="onEditSend($event)"
      (copySend)="onCopySend($event)"
      (deleteSend)="onDeleteSend($event)"
      (removeAuth)="onRemoveAuth($event)"
    >
      <tools-new-send-dropdown-v2
        slot="empty-button"
        [hideIcon]="true"
        buttonType="secondary"
        (addSend)="addSend($event)"
      />
    </tools-send-list>
  }
</div>
