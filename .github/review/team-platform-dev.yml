  - apps/browser/store/locales
  - apps/cli/src/locales
  - apps/desktop/src/locales
  - apps/web/src/locales

  ## Platform team files ##
  - apps/browser/src/platform
  - apps/cli/src/platform
  - apps/desktop/scripts
  - apps/desktop/src/platform
  - apps/desktop/resources
  - apps/web/src/app/platform
  - libs/angular/src/platform
  - libs/common/src/platform
  - libs/common/spec
  - libs/common/src/state-migrations
  - libs/platform
  - libs/storage-core
  - libs/logging
  - libs/logging-angular
  - libs/managed-settings
  - libs/storage-test-utils
  - libs/messaging
  - libs/serialization
  - libs/guid
  - libs/client-type
  - libs/core-test-utils
  - libs/state
  - libs/state-internal
  - libs/state-test-utils
