@if (!isLoaded) {
  <div class="container loading-spinner">
    <i class="bwi bwi-spinner bwi-spin bwi-3x" aria-hidden="true"></i>
  </div>
} @else {
  <bit-nav-group
    #vaultGroup
    icon="bwi-vault"
    [text]="'vault' | i18n"
    route="vault"
    [disableToggleOnClick]="true"
    [open]="isOpen(vaultGroupNodeId)"
    (openChange)="onOpenChange(vaultGroupNodeId, $event)"
    (mousedown)="onVaultGroupInteractionStart()"
    (keydown)="onVaultGroupInteractionStart()"
  >
    <app-organization-filter
      [activeFilter]="activeFilter()"
      [organizations]="organizations()"
      [activeOrganizationDataOwnership]="activeOrganizationDataOwnershipPolicy"
      [activeSingleOrganizationPolicy]="activeSingleOrganizationPolicy"
    />
    <app-type-filter [activeFilter]="activeFilter()" [cipherTypes]="cipherTypes()" />
    <app-status-filter [activeFilter]="activeFilter()" />
    @if (showCollectionsFilter()) {
      <bit-nav-group
        [icon]="'bwi-collection-shared' | vfo1Icon"
        [text]="'collections' | vfo1I18n: 'sharedFolders'"
        [appA11yTitle]="'collections' | vfo1I18n: 'sharedFolders'"
        [disableToggleOnClick]="true"
        [open]="isOpen(collections()?.node?.id)"
        (openChange)="onOpenChange(collections()?.node?.id, $event)"
      >
        @for (collection of collections()?.children ?? []; track collection.node.id) {
          <app-collection-filter [activeFilter]="activeFilter()" [collection]="collection" />
        }
      </bit-nav-group>
    }
    <bit-nav-group
      icon="bwi-folder"
      [text]="'folders' | vfo1I18n: 'myFolders'"
      [appA11yTitle]="'folders' | vfo1I18n: 'myFolders'"
      [disableToggleOnClick]="true"
      [open]="isOpen(folders()?.node?.id)"
      (openChange)="onOpenChange(folders()?.node?.id, $event)"
    >
      @for (folder of folders()?.children ?? []; track folder.node.id) {
        <app-folder-filter
          [activeFilter]="activeFilter()"
          [folder]="folder"
          (onEditFolder)="editFolder($event)"
        />
      }
    </bit-nav-group>
  </bit-nav-group>
}
