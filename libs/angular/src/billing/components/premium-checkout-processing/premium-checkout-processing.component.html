<bit-simple-dialog>
  <bit-icon bitDialogIcon name="bwi-info-circle" class="tw-text-3xl tw-text-fg-brand"></bit-icon>
  <span bitDialogTitle>{{ "confirmingYourUpgrade" | i18n }}</span>
  <span bitDialogContent>{{ body }}</span>
  <ng-container bitDialogFooter>
    <button
      id="premium-checkout-processing_button_close"
      type="button"
      bitButton
      buttonType="primary"
      bitDialogClose
    >
      {{ "close" | i18n }}
    </button>
  </ng-container>
</bit-simple-dialog>
