<ng-container [formGroup]="form()">
  <bit-form-field class="tw-max-w-sm">
    <bit-label>{{ "keeperEmail" | i18n }}</bit-label>
    <input
      bitInput
      type="text"
      formControlName="keeperEmail"
      id="importer-controls_input_keeper-email"
    />
  </bit-form-field>
  <bit-form-field class="tw-max-w-sm">
    <bit-label>{{ "dataCenterLocation" | i18n }}</bit-label>
    <bit-select formControlName="keeperRegion" id="importer-controls_select_keeper-region">
      @for (region of regions; track region.value) {
        <bit-option [value]="region.value" [label]="region.label" />
      }
    </bit-select>
  </bit-form-field>
</ng-container>
