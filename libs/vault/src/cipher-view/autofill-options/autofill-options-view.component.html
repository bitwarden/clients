<section class="tw-mb-5 bit-compact:tw-mb-4">
  <bit-section-header>
    <h2 bitTypography="h6">{{ "autofillOptions" | i18n }}</h2>
  </bit-section-header>
  <bit-card>
    @for (item of uris(); track $index; let last = $last) {
      @if (item.desktopAppName != null) {
        <bit-form-field [disableMargin]="last" data-testid="autofill-view-list">
          <bit-label>
            {{ "desktopApp" | i18n }}
          </bit-label>
          <input
            readonly
            bitInput
            type="text"
            [value]="item.desktopAppName"
            aria-readonly="true"
            data-testid="login-desktop-app"
          />
        </bit-form-field>
      } @else {
        <bit-form-field [disableMargin]="last" data-testid="autofill-view-list">
          <bit-label>
            {{ "website" | i18n }}
          </bit-label>
          <input
            readonly
            bitInput
            type="text"
            [value]="item.login.hostOrUri"
            aria-readonly="true"
            data-testid="login-website"
          />
          <button
            bitIconButton="bwi-external-link"
            bitSuffix
            type="button"
            (click)="openWebsite(item.login.launchUri)"
            data-testid="launch-website"
            [label]="('launch' | i18n) + ' ' + item.login.hostOrUri"
          ></button>
          <button
            bitIconButton="bwi-clone"
            bitSuffix
            type="button"
            [appCopyClick]="item.login.uri"
            [valueLabel]="'website' | i18n"
            showToast
            [label]="'copyWebsite' | i18n"
            data-testid="copy-website"
          ></button>
        </bit-form-field>
      }
    }
  </bit-card>
</section>
