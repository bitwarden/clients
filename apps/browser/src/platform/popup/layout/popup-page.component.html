<ng-content select="[slot=header]"></ng-content>
<main class="tw-flex-1 tw-overflow-hidden tw-flex tw-flex-col tw-relative tw-bg-background-alt">
  <ng-content select="[slot=full-width-notice]"></ng-content>
  <!--
    x padding on this container is designed to always be a minimum of 0.75rem (equivalent to tailwind's tw-px-3), or 0.5rem (equivalent
    to tailwind's tw-px-2) in compact mode, but stretch to fill the remainder of the container when the content reaches a maximum of
    640px in width (equivalent to tailwind's `sm` breakpoint)

    Vertical padding is applied to the projected children rather than to this container, via
    `>*:not(:empty)`. Components projected here keep a host element in the DOM and decide
    internally whether to render anything, so padding the container would reserve space above
    content that isn't there. `:not(:empty)` skips exactly those hosts, so consumers only declare
    `slot="above-scroll-area"` and get the right spacing.

    The scrolled separator is not applied here — see the scroll region below.
  -->
  <div
    class="tw-px-[max(0.75rem,calc((100%-(var(--tw-sm-breakpoint)))/2))] bit-compact:tw-px-[max(0.5rem,calc((100%-(var(--tw-sm-breakpoint)))/2))] [&>*:not(:empty)]:tw-block [&>*:not(:empty)]:tw-py-3 bit-compact:[&>*:not(:empty)]:tw-py-2"
    [ngClass]="{ 'tw-invisible': loading() }"
  >
    <ng-content select="[slot=above-scroll-area]"></ng-content>
  </div>
  <!--
    x padding on this container is designed to always be a minimum of 0.75rem (equivalent to tailwind's tw-px-3), or 0.5rem (equivalent
    to tailwind's tw-px-2) in compact mode, but stretch to fill the remainder of the container when the content reaches a maximum of
    640px in width (equivalent to tailwind's `sm` breakpoint)
  -->
  <!--
    The scrolled separator lives on this element's top edge rather than on the content above it:
    it marks the boundary being scrolled past, so it has to appear even when the above-scroll-area
    is empty (e.g. a presentation that supplies its own header).
  -->
  <div
    class="tw-size-full tw-styled-scrollbar tw-border-0 tw-border-t tw-border-solid tw-transition-colors tw-duration-200"
    data-testid="popup-layout-scroll-region"
    [ngClass]="{
      '!tw-overflow-hidden': hideOverflow(),
      'tw-overflow-y-auto': !hideOverflow(),
      'tw-flex tw-flex-col tw-flex-1 tw-min-h-0': fillContent(),
      'tw-invisible': loading(),
      'tw-border-secondary-300': scrolled(),
      'tw-border-transparent': !scrolled(),
      'tw-relative tw-py-3 bit-compact:tw-py-2 tw-px-[max(0.75rem,calc((100%-(var(--tw-sm-breakpoint)))/2))] bit-compact:tw-px-[max(0.5rem,calc((100%-(var(--tw-sm-breakpoint)))/2))]':
        !disablePadding(),
    }"
    bitScrollLayoutHost
    [tabindex]="hideOverflow() ? null : '0'"
  >
    <ng-content></ng-content>
  </div>
  <span
    class="tw-absolute tw-inset-0 tw-flex tw-items-center tw-justify-center tw-text-main"
    [ngClass]="{ 'tw-invisible': !loading() }"
  >
    <bit-icon name="bwi-spinner" class="bwi-lg bwi-spin" [ariaLabel]="loadingText()"></bit-icon>
  </span>
</main>
<ng-content select="[slot=footer]"></ng-content>
