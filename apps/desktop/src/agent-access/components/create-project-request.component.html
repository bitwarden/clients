<form [bitSubmit]="submit" [formGroup]="createProjectRequestForm">
  <app-agent-access-request-dialog
    [dialogTitle]="dialogTitle"
    [requester]="requesterView"
    [grade]="grade"
    [consequenceSummary]="consequenceSummary"
  >
    @if (isRename()) {
      <!-- Two clearly-labeled names read left-to-right, rather than one readonly input holding
           "old → new" as a single opaque string: same information, but each name gets its own
           sensitive-name treatment (agent-access-design-spec.md §2.3) and a screen reader gets
           two labeled values instead of one run-together sentence. -->
      <div class="tw-flex tw-items-end tw-gap-3">
        <div class="tw-flex tw-min-w-0 tw-flex-1 tw-flex-col tw-gap-1">
          <span bitTypography="helper" noMargin class="tw-text-muted">{{
            "agentAccessProjectCurrentNameLabel" | i18n
          }}</span>
          <span
            id="create-project-request_text_current-name"
            class="tw-truncate tw-font-mono tw-text-fg-sensitive"
            bitTypography="body1"
            noMargin
            >{{ params.projectName }}</span
          >
        </div>
        <bit-icon name="bwi-arrow-right" class="tw-mb-1 tw-shrink-0 tw-text-muted"></bit-icon>
        <div class="tw-flex tw-min-w-0 tw-flex-1 tw-flex-col tw-gap-1">
          <span bitTypography="helper" noMargin class="tw-text-muted">{{
            "agentAccessProjectNewNameLabel" | i18n
          }}</span>
          <span
            id="create-project-request_text_new-name"
            class="tw-truncate tw-font-mono tw-text-fg-sensitive"
            bitTypography="body1"
            noMargin
            >{{ params.newProjectName }}</span
          >
        </div>
      </div>
    } @else {
      <bit-form-field disableMargin>
        <bit-label>{{ "agentAccessProject" | i18n }}</bit-label>
        <input
          id="create-project-request_input_name"
          bitInput
          type="text"
          class="tw-font-mono tw-text-fg-sensitive"
          [value]="params.projectName"
          readonly
        />
      </bit-form-field>

      <bit-form-field disableMargin>
        <bit-label>{{ "organization" | i18n }}</bit-label>
        <bit-select
          id="create-project-request_select_organization"
          formControlName="organizationId"
        >
          @for (org of params.organizations; track org.id) {
            <bit-option [value]="org.id" [label]="org.name"></bit-option>
          }
        </bit-select>
      </bit-form-field>
    }

    <ng-container dialogFooter>
      <button
        id="create-project-request_button_authorize"
        type="submit"
        bitButton
        bitFormButton
        buttonType="primary"
        [disabled]="!isRename() && createProjectRequestForm.invalid"
      >
        <span>{{ "authorize" | i18n }}</span>
      </button>
      <button
        id="create-project-request_button_deny"
        type="button"
        bitButton
        bitFormButton
        buttonType="secondary"
        (click)="deny()"
      >
        {{ "deny" | i18n }}
      </button>
    </ng-container>
  </app-agent-access-request-dialog>
</form>
