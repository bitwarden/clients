# This workflow will run in the context of the source of the PR.
# On a PR, each commit checks whether UI-related files changed:
#   - No UI changes: Chromatic is told to skip, which marks its required checks as passing.
#   - UI changes on a PR that is ready for review: the full build runs on every commit.
#   - UI changes on a draft PR: nothing is published in Chromatic automatically, so Chromatic's
#     checks stay pending until someone adds the "ci:chromatic" label or marks the PR ready for
#     review. While the label is on the PR, the full build runs on every commit. Remove the label
#     to stop.
# Pushes to main, rc and hotfix-rc run the full build without a label to keep baselines current.
# On a PR from a fork, the pull_request workflow is skipped because the fork will not have access to
# secrets. To run Chromatic for a fork PR, review it and add the "ci:signed-build" label to run
# "chromatic-target.yml".

name: Chromatic

on:
  push:
    branches:
      - "main"
      - "rc"
      - "hotfix-rc"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_call:
    inputs: {}

permissions:
  contents: read

jobs:
  check-run-mode:
    name: Check run mode
    runs-on: ubuntu-24.04
    # Only run on events other than pull_request, and if it is a pull_request event, only run if
    # the PR comes from an internal contributor
    # This check avoids running the workflow twice for external/forked PRs that are already running
    # the pull_request_target workflow
    # Adding a label only runs anything when it is "ci:chromatic" on a draft PR. A PR that is ready
    # for review has already run for its latest commit
    # Marking a labeled draft PR ready for review does not run anything for the same reason
    # A draft PR opened with the label fires both `opened` and `labeled`; only `labeled` runs
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.action != 'labeled'
          || (github.event.label.name == 'ci:chromatic' && github.event.pull_request.draft))
        && (github.event.action != 'ready_for_review'
          || !contains(github.event.pull_request.labels.*.name, 'ci:chromatic'))
        && (github.event.action != 'opened'
          || !github.event.pull_request.draft
          || !contains(github.event.pull_request.labels.*.name, 'ci:chromatic')))
    permissions:
      contents: read
      pull-requests: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # PR events read the changed files from the API, so only pushes need the repo
      - name: Check out repo
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed files
        id: get-changed-files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            storyFiles:
              - "apps/!(cli)/**"
              - "bitwarden_license/bit-pam-components/**"
              - "bitwarden_license/bit-web/src/app/**"
              - "libs/!(eslint)/**"
              - "package.json"
              - ".storybook/**"
              - "apps/browser/src/autofill/content/components/**"
              - ".github/workflows/chromatic.yml"

      # build: full Storybook build and Chromatic publish
      # skip: Chromatic is told to skip, which marks its checks as passing
      # wait: nothing is published, so Chromatic's checks stay pending until the label is added or
      #       the PR is marked ready for review. Only draft PRs without the label wait.
      - name: Determine run mode
        id: mode
        env:
          _IS_DRAFT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          _HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:chromatic') }}
          _STORY_FILES: ${{ steps.get-changed-files.outputs.storyFiles }}
        run: |
          if [[ "$_STORY_FILES" != "true" ]]; then
            MODE="skip"
          elif [[ "$_IS_DRAFT_PR" == "true" && "$_HAS_LABEL" != "true" ]]; then
            MODE="wait"
          else
            MODE="build"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Posted once per PR to explain the process. It is never updated with run results.
      - name: Comment Chromatic instructions on draft PR
        if: steps.mode.outputs.mode == 'wait'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const COMMENT_TAG = '<!-- comment_tag: chromatic-draft-instructions -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            if (comments.some((comment) => comment.body?.startsWith(COMMENT_TAG))) {
              return;
            }

            const body = [
              COMMENT_TAG,
              '💅 **UIF Bot:**',
              '',
              'This PR contains UI changes. Chromatic workflows are not run automatically in draft PRs. Add the `ci:chromatic` label to run the workflows on every commit while the PR is a draft, or mark the PR as ready for review.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  chromatic:
    name: Chromatic
    runs-on: ubuntu-22.04
    needs: check-run-mode
    # A job-level `if` posts nothing to Chromatic, which is what keeps its checks pending
    if: needs.check-run-mode.outputs.mode != 'wait'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{  github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Get Node version
        id: retrieve-node-version
        if: needs.check-run-mode.outputs.mode == 'build'
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}
        if: needs.check-run-mode.outputs.mode == 'build'

      - name: Cache NPM
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.npm"
          key: ${{ runner.os }}-npm-chromatic-${{ hashFiles('**/package-lock.json') }}
        if: needs.check-run-mode.outputs.mode == 'build'

      - name: Install Node dependencies
        if: needs.check-run-mode.outputs.mode == 'build'
        run: npm ci

      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
  
      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-clients
          secrets: "CHROMATIC-PROJECT-TOKEN,CHROMATIC-PROJECT-TOKEN-AUTOFILL"
  
      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      # Manually build the Storybook to resolve a bug related to TurboSnap
      - name: Build Autofill Storybook
        if: needs.check-run-mode.outputs.mode == 'build'
        run: npm run build-storybook:autofill:ci

      - name: Publish to Chromatic for Autofill
        id: publish-chromatic-autofill
        uses: chromaui/action@94713c544284a14195de3b50ef24301579f1877e # v18.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ steps.get-kv-secrets.outputs.CHROMATIC-PROJECT-TOKEN-AUTOFILL }}
          storybookBaseDir: ./apps/browser/src/autofill/content/components
          storybookBuildDir: ./apps/browser/src/autofill/content/components/storybook-static
          exitOnceUploaded: true
          onlyChanged: true
          # Rather than use an `if` check on the whole publish step, we need to tell Chromatic to skip so that any Chromatic-spawned actions are properly skipped
          skip: ${{ needs.check-run-mode.outputs.mode == 'skip' }}

      # Manually build the Storybook to resolve a bug related to TurboSnap
      - name: Build CL Storybook
        if: needs.check-run-mode.outputs.mode == 'build'
        env:
          AUTOFILL_CHROMATIC_URL: ${{ steps.publish-chromatic-autofill.outputs.storybookUrl }}
        run: npm run build-storybook:ci

      - name: Publish to Chromatic for CL
        uses: chromaui/action@94713c544284a14195de3b50ef24301579f1877e # v18.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ steps.get-kv-secrets.outputs.CHROMATIC-PROJECT-TOKEN }}
          storybookBuildDir: ./storybook-static
          exitOnceUploaded: true
          onlyChanged: true
          externals: |
            libs/components/**/*.scss
            libs/components/**/*.css
            libs/components/tailwind.config*.js
          # Rather than use an `if` check on the whole publish step, we need to tell Chromatic to skip so that any Chromatic-spawned actions are properly skipped
          skip: ${{ needs.check-run-mode.outputs.mode == 'skip' }}
