# Owner review list for @bitwarden/team-auth-dev
#
# This file is YAML. It has two keys, and each key contains a list of path patterns:
#   include   Required. Paths where a change always needs this team's review.
#   exclude   Optional. Paths that never need this team's review, even when an include pattern
#             matches them.
# Any other key makes the list invalid.
#
# Patterns use CODEOWNERS syntax, such as `libs/auth`, `*.spec.ts`, and `apps/**/auth`. Negation
# with `!` and ranges with `[ ]` are not supported. Put quotes around a pattern that starts with
# `*`, because YAML reads a leading `*` as an alias.

include:
  ## Always-review lists are owned by their teams
  - .github/review/team-auth-dev.yml

  # Web connectors
  - apps/web/src/connectors

  ## Auth team files ##
  - apps/browser/src/auth
  - apps/cli/src/auth
  - apps/desktop/src/auth
  - apps/web/src/app/auth
  - apps/web/src/app/components/environment-selector
  - libs/auth
  - libs/user-core
  - bitwarden_license/bit-web/src/app/auth
  - libs/angular/src/auth
  - libs/common/src/auth
