<popup-page>
  <popup-header slot="header" [pageTitle]="'health' | i18n">
    <ng-container slot="end">
      <app-pop-out />
      <app-current-account />
    </ng-container>
  </popup-header>
  @if (!hasRunHealthScan()) {
    <health-intro (onTriggerHealthScan)="handleHealthScan()" />
  } @else {
    <div>
      <button type="button" (click)="routeToDetails()">Go to details</button>
    </div>
  }
</popup-page>
