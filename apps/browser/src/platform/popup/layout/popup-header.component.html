<!--
  Each slot is declared exactly once. A `select` repeated across branches of a control flow block
  would bind all matching content to whichever copy comes first, leaving the other branch empty.

  `end` is the trailing edge of the topmost bar, so it belongs to the app bar when that bar exists and
  to the title bar otherwise. Declaring it here and rendering it into whichever branch is live is the
  only way to move it between the two.
-->
<ng-template #endSlot>
  <ng-content select="[slot=end]"></ng-content>
</ng-template>

<!--
  One `header` around both bars, so the banner landmark covers the whole region regardless of the flag.
  The bars themselves are plain containers: the app bar is chrome belonging to the extension, the title
  bar belongs to the page, and neither is a landmark on its own.

  `header` carries the styling of the one-bar header and nothing else. Two bars each paint themselves,
  so with the flag on this is a bare landmark.
-->
<header [class]="headerClasses()">
  @if (vfo1Enabled()) {
    <div
      data-testid="app-bar"
      class="tw-bg-bg-nav tw-text-fg-nav tw-py-3 bit-compact:tw-py-2 tw-px-4 bit-compact:tw-px-3"
    >
      <div
        class="tw-max-w-screen-sm tw-mx-auto tw-flex tw-w-full tw-items-center tw-justify-between tw-gap-2 tw-h-9"
      >
        <div class="tw-inline-flex tw-items-center tw-gap-2">
          <bit-svg
            class="tw-block tw-w-28 [&_path]:tw-fill-fg-nav"
            [content]="logo"
            [ariaLabel]="'appLogoLabel' | i18n"
          ></bit-svg>
        </div>
        <div class="tw-inline-flex tw-items-center tw-gap-2">
          <ng-container *ngTemplateOutlet="endSlot"></ng-container>
        </div>
      </div>
    </div>
  }

  <div data-testid="title-bar" [class]="titleBarClasses()">
    <div class="tw-max-w-screen-sm tw-mx-auto tw-flex tw-justify-between tw-w-full">
      <div class="tw-inline-flex tw-items-center tw-gap-2 tw-h-9">
        @if (showBackButton()) {
          <button
            bitIconButton="bwi-angle-left"
            type="button"
            [label]="'back' | i18n"
            [bitAction]="backAction()"
          ></button>
        }
        @if (vfo1Enabled()) {
          <ng-content select="[slot=start]"></ng-content>
        }
        @if (pageTitle()) {
          <div class="tw-inline-flex tw-items-center tw-gap-1">
            <h1 bitTypography="h3" [class]="vfo1Enabled() ? '!tw-mb-0' : '!tw-mb-0.5'">
              {{ pageTitle() }}
            </h1>
            <ng-content select="[slot=title-suffix]"></ng-content>
          </div>
        }
        <!--
          The app bar owns the extension's branding, and `pageTitle` owns the title, so the legacy
          default slot has nothing left to carry once the flag is on. Its only consumers project a
          Bitwarden logo, which the app bar would otherwise duplicate.
        -->
        @if (!vfo1Enabled()) {
          <ng-content></ng-content>
        }
      </div>
      <div class="tw-inline-flex tw-items-center tw-gap-2 tw-h-9">
        @if (vfo1Enabled()) {
          <ng-content select="[slot=title-end]"></ng-content>
        } @else {
          <ng-container *ngTemplateOutlet="endSlot"></ng-container>
        }
      </div>
    </div>
  </div>
</header>
