[package]
name = "bw_access"
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = { workspace = true }

# The desktop skips processes named `bw-access` when naming the requesting app.
[[bin]]
name = "bw-access"
path = "src/main.rs"

[dependencies]
agent_access = { path = "../agent_access" }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "time",
] }

[dev-dependencies]
async-trait = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
