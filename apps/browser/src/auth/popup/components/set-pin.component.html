<form [bitSubmit]="submit" [formGroup]="setPinForm" bit-dialog data-testid="set-pin-dialog">
  <div class="tw-font-medium" bitDialogTitle>
    {{ "setYourPinTitle" | i18n }}
  </div>
  <div bitDialogContent>
    <p>
      {{ "setPinCode" | i18n }}
    </p>
    <bit-form-field>
      <bit-label>{{ "pin" | i18n }}</bit-label>
      <input
        class="tw-font-mono"
        bitInput
        type="password"
        formControlName="pin"
        data-testid="set-pin-input"
      />
      <button type="button" bitIconButton bitSuffix bitPasswordInputToggle></button>
    </bit-form-field>
    <label class="tw-flex tw-items-start tw-gap-2" *ngIf="showMasterPasswordOnClientRestartOption">
      <input
        class="tw-mt-1"
        type="checkbox"
        bitCheckbox
        formControlName="requireMasterPasswordOnClientRestart"
        data-testid="set-pin-require-master-password-checkbox"
      />
      <span>{{ "lockWithMasterPassOnRestart1" | i18n }}</span>
    </label>
  </div>
  <ng-container bitDialogFooter>
    <button
      type="submit"
      bitButton
      bitFormButton
      buttonType="primary"
      data-testid="set-pin-submit-button"
    >
      <span>{{ "setYourPinButton" | i18n }}</span>
    </button>
    <button type="button" bitButton bitFormButton buttonType="secondary" bitDialogClose>
      {{ "cancel" | i18n }}
    </button>
  </ng-container>
</form>
