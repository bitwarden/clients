@switch (viewState()) {
  @case (AcceptOrgOpenInviteViewState.Loading) {
    <div class="tw-flex tw-justify-center tw-py-8">
      <bit-spinner variant="primary" size="lg" [title]="'loading' | i18n"></bit-spinner>
    </div>
  }
  @case (AcceptOrgOpenInviteViewState.Error) {
    <p data-testid="accept-org-open-invite-error-message">
      {{ errorMessageI18nKey() | i18n }}
    </p>
  }
}
