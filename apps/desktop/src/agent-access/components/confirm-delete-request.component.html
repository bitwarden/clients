<app-agent-access-request-dialog
  [dialogTitle]="dialogTitle()"
  [requester]="requesterView()"
  [grade]="AgentAccessConsequence.Destroy"
  [consequenceSummary]="consequenceSummary()"
  [consequenceDetail]="consequenceDetail()"
>
  <!-- WHICH exact item — name only, never a value (agent-access-design-spec.md §2.3, invariant 21). -->
  <div class="tw-flex tw-flex-col tw-gap-1">
    <span class="tw-break-all tw-font-mono tw-text-fg-sensitive" bitTypography="body2">{{
      params.itemName
    }}</span>
    @if (params.organizationName) {
      <span class="tw-text-muted" bitTypography="helper">{{ params.organizationName }}</span>
    }
  </div>

  <ng-container dialogFooter>
    <button
      id="confirm-delete-request_button_authorize"
      type="button"
      bitButton
      buttonType="danger"
      [bitAction]="submit"
    >
      <span>{{ "agentAccessDeleteConfirmAction" | i18n }}</span>
    </button>
    <button
      id="confirm-delete-request_button_deny"
      type="button"
      bitButton
      buttonType="secondary"
      (click)="deny()"
    >
      {{ "deny" | i18n }}
    </button>
  </ng-container>
</app-agent-access-request-dialog>
