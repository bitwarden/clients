<form [bitSubmit]="submit" [formGroup]="approveCredentialRequestForm" bit-dialog>
  <div class="tw-font-medium" bitDialogTitle>{{ "credentialApprovalTitle" | i18n }}</div>
  <div bitDialogContent>
    <b>{{params.applicationName}}</b> {{ "credentialApprovalMessageInfix" | i18n }}
    <b>{{params.cipherName}}</b>
  </div>
  <ng-container bitDialogFooter>
    <button type="submit" bitButton bitFormButton buttonType="primary">
      <span>{{ "authorize" | i18n }}</span>
    </button>
    <button type="button" bitButton bitFormButton buttonType="secondary" bitDialogClose>
      {{ "deny" | i18n }}
    </button>
  </ng-container>
</form>
