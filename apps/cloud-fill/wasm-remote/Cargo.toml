[package]
name = "cloud-fill-remote-wasm"
description = "Agent Access RemoteClient bindings for the cloud-fill extension service worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
ap-client = { path = "../../../../agent-access/crates/ap-client", default-features = false }
ap-relay-client = { path = "../../../../agent-access/crates/ap-relay-client", default-features = false }
ap-relay-protocol = { path = "../../../../agent-access/crates/ap-relay-protocol", default-features = false }
ap-noise = { path = "../../../../agent-access/crates/ap-noise" }

async-trait = "0.1"
base64 = "0.22"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
hex = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36.0", default-features = false, features = ["sync"] }
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CloseEvent", "ErrorEvent", "MessageEvent", "WebSocket"] }

[workspace]

[lints.clippy]
unwrap_used = "deny"
string_slice = "warn"

[profile.release]
opt-level = "s"
lto = true
