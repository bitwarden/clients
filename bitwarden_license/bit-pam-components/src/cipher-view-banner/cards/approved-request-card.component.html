<bit-card data-testid="cipher-view-banner-approved">
  <div class="tw-flex tw-flex-col tw-gap-4">
    <app-pam-banner-card-header [icon]="badgeLook.ready.icon" variant="success">
      <span slot="title">{{ "pamApprovedRequestBannerHeadingV2" | i18n }}</span>
      <span slot="description" data-testid="cipher-view-banner-approved-hint">
        {{ accessUntilLabel() }}
      </span>
    </app-pam-banner-card-header>

    @if (itemInUseMessage(); as message) {
      <bit-callout
        type="warning"
        [title]="'pamStartItemInUseTitle' | i18n"
        [id]="itemInUseCalloutId"
        data-testid="cipher-view-banner-approved-item-in-use"
      >
        <!-- One element per run, so template whitespace never lands before the punctuation. -->
        <span>{{ message.before }}</span>
        @if (message.time) {
          <strong>{{ message.time }}</strong>
        }
        <span>{{ message.after }}</span>
      </bit-callout>
    }

    <button
      type="button"
      bitButton
      buttonType="primary"
      [size]="popupLayout ? 'default' : 'small'"
      [class.tw-w-full]="popupLayout"
      [class.tw-self-start]="!popupLayout"
      [bitAction]="startAction()"
      [disabled]="startBlocked()"
      [attr.aria-describedby]="startBlocked() ? itemInUseCalloutId : null"
      id="pam-cipher-view-banner_button_start"
    >
      {{ "pamStartLeaseButton" | i18n }}
    </button>
  </div>
</bit-card>
