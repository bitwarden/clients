<div class="tw-@container/health-intro tw-max-w-6xl tw-py-4">
  <div
    class="tw-flex tw-flex-col tw-gap-8 @3xl/health-intro:tw-flex-row @3xl/health-intro:tw-items-center"
  >
    <div class="tw-flex tw-min-w-0 tw-flex-1 tw-flex-col tw-items-start tw-gap-4">
      <h2 bitTypography="h2" class="!tw-mb-0 !tw-text-fg-heading">
        {{ "introducingHealth" | i18n }}
      </h2>
      <p bitTypography="body1" class="!tw-mb-0 !tw-text-fg-body">
        {{ "healthIntroDescription" | i18n }}
      </p>
      <button
        type="button"
        bitButton
        buttonType="primary"
        data-testid="health-intro-scan-button"
        (click)="handleScanVaultClick()"
      >
        {{ "scanMyVault" | i18n }}
      </button>
    </div>
    <img
      [src]="introImage()"
      alt=""
      class="tw-h-auto tw-w-full tw-max-w-lg tw-shrink-0"
      data-testid="health-intro-illustration"
    />
  </div>
</div>
