<popup-page>
  <popup-header slot="header" pageTitle="{{ 'about' | i18n }}" showBackButton>
    <ng-container slot="end">
      <app-pop-out></app-pop-out>
    </ng-container>
  </popup-header>

  <bit-item-group>
    <bit-item>
      <button type="button" bit-item-content (click)="troubleshoot()">
        {{ "troubleshooting" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="about()">
        {{ "aboutBitwarden" | i18n }}
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="launchHelp()">
        {{ "helpCenter" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="openWebVault()">
        {{ "bitWebVaultApp" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
    <bit-item>
      <button type="button" bit-item-content (click)="rate()">
        {{ "rateExtension" | i18n }}
        <i slot="end" class="bwi bwi-external-link" aria-hidden="true"></i>
      </button>
    </bit-item>
  </bit-item-group>

  @if (showEarlyAccessToggle()) {
    <h2 bitTypography="h6" class="tw-font-medium tw-mt-4">{{ "earlyAccess" | i18n }}</h2>
    <bit-card>
      <form [formGroup]="earlyAccessForm">
        <bit-form-control disableMargin>
          <input
            bitCheckbox
            id="about-page_input_early-access"
            formControlName="earlyAccess"
            type="checkbox"
          />
          <bit-label>{{ "earlyAccess" | i18n }}</bit-label>
          <bit-hint>{{ "earlyAccessDesc" | i18n }}</bit-hint>
        </bit-form-control>
      </form>
    </bit-card>
  }
</popup-page>
