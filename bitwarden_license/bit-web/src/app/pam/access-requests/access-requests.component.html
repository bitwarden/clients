<app-header [title]="'pamAccessRequestsTitle' | i18n">
  @if (canApprove()) {
    <p slot="subtitle" bitTypography="body1" class="tw-mb-0 tw-text-muted">
      {{ "pamAccessRequestsSubtitle" | i18n }}
    </p>
  }
  <bit-tab-nav-bar slot="tabs" [label]="'pamAccessRequestsTitle' | i18n">
    @if (canApprove()) {
      <bit-tab-link route="approvals" [berryValue]="approvalsCount()">{{
        "pamTabApprovals" | i18n
      }}</bit-tab-link>
    }
    <bit-tab-link route="my-requests" [berryValue]="myRequestsCount()">{{
      "pamTabMyRequests" | i18n
    }}</bit-tab-link>
    <bit-tab-link route="history">{{ "pamTabHistory" | i18n }}</bit-tab-link>
  </bit-tab-nav-bar>
</app-header>

<router-outlet></router-outlet>
