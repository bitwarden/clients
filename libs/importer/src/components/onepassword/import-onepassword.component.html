<!--
  1Password direct import, rendered inside the parent import component's form. Collects the account
  to sign in to: its email and sign-in address. The Secret Key, password and two-factor code are
  asked for in dialogs once the import starts.
-->

<div [formGroup]="formGroup">
  <bit-form-field>
    <bit-label>{{ "onePasswordEmail" | i18n }}</bit-label>
    <input bitInput type="email" id="import-onepassword_input_email" formControlName="email" />
    <bit-hint>{{
      (importing() ? "importingYourAccount" : "onePasswordEmailHint") | i18n
    }}</bit-hint>
  </bit-form-field>

  <div class="tw-flex tw-items-start tw-gap-2">
    <bit-form-field class="tw-grow tw-basis-0" disableMargin>
      <bit-label>{{ "signInAddress" | i18n }}</bit-label>
      <input
        bitInput
        type="text"
        id="import-onepassword_input_subdomain"
        formControlName="subdomain"
        appInputVerbatim
      />
    </bit-form-field>
    <span class="tw-self-end tw-pb-2 tw-font-bold" aria-hidden="true">.</span>
    <bit-form-field class="tw-grow tw-basis-0 tw-self-end" disableMargin>
      <bit-select
        id="import-onepassword_bit-select_domain"
        formControlName="domain"
        [attr.aria-label]="'domain' | i18n"
      >
        @for (d of domains; track d.value) {
          <bit-option [value]="d.value" [label]="d.label" />
        }
      </bit-select>
    </bit-form-field>
  </div>

  @if (importError(); as message) {
    <bit-callout type="danger" class="tw-block tw-mt-4">{{ message }}</bit-callout>
  }
</div>
