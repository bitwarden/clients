@if (entries().length) {
  <div class="tw-flex tw-items-center tw-gap-2">
    @let current = selected();
    @if (current) {
      <bit-icon-tile
        [icon]="current.tile.icon"
        [variant]="current.tile.variant ?? 'primary'"
        [color]="current.tile.color"
        [emphasis]="current.tile.emphasis ?? 'subtle'"
      ></bit-icon-tile>
      <!--
        The page's `h1`: the header drops its own whenever this label renders, so the vault page
        would otherwise have no top-level heading above the list's `h2` sections.
      -->
      <h1 bitTypography="h5" class="!tw-mb-0 tw-text-main">
        {{ current.id === null ? ("allItems" | i18n) : current.label }}
      </h1>
    }
    <button
      type="button"
      class="tw-size-6 tw-box-content tw-flex tw-bg-transparent tw-border-0 tw-p-0 tw-cursor-pointer tw-rounded focus-visible:tw-outline-none focus-visible:tw-ring-2 focus-visible:tw-ring-primary-600 focus-visible:tw-ring-offset-2"
      [bitMenuTriggerFor]="vaultOptions"
      (click)="menuOpen.set(true)"
      [attr.aria-label]="'switchVault' | i18n"
      data-testid="vault-switcher"
    >
      <bit-icon
        name="bwi-angle-down"
        data-testid="vault-switcher-chevron"
        class="tw-size-6 tw-shrink-0 tw-flex tw-text-lg tw-items-center tw-justify-center tw-leading-none tw-rounded tw-transition-colors"
        [class.tw-text-primary-600]="menuOpen()"
        [class.tw-bg-primary-100]="menuOpen()"
        [class.tw-text-primary-700]="!menuOpen()"
      ></bit-icon>
    </button>
  </div>
  <bit-menu #vaultOptions (closed)="menuOpen.set(false)">
    @for (entry of entries(); track entry.id) {
      <button type="button" bitMenuItem (click)="select(entry.id)">
        <bit-icon
          name="bwi-check"
          slot="start"
          class="tw-w-4"
          data-testid="vault-switcher-check"
          [class.tw-invisible]="entry.id !== selectedId()"
        ></bit-icon>
        <bit-icon-tile
          [icon]="entry.tile.icon"
          [variant]="entry.tile.variant ?? 'primary'"
          [color]="entry.tile.color"
          [emphasis]="entry.tile.emphasis ?? 'subtle'"
          size="xs"
          class="tw-mr-2"
        ></bit-icon-tile>
        {{ entry.id === null ? ("allItems" | i18n) : entry.label }}
      </button>
    }
  </bit-menu>
}
