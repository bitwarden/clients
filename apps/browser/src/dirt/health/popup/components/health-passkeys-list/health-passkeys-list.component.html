<bit-table-v2
  bitScrollCollapseSource
  [tableDef]="table"
  [filter]="filterPredicate"
  [filters]="filtersToRestore()"
  [sort]="sortState()"
  [loading]="loading()"
  [loadingRows]="4"
  [trackBy]="trackRow"
  presentation="list"
  height="fill"
  scrollLayoutHost
  [virtualRowHeight]="rowHeight()"
>
  <bit-table-toolbar bitCollapseOnScroll>
    <bit-search class="tw-flex-1" autocomplete="off" [placeholder]="'search' | i18n"></bit-search>

    @if (folderOptions().length) {
      <bit-filter-menu
        key="folder"
        multiple
        icon="bwi-folder"
        [placeholderText]="'folder' | i18n"
        [options]="folderOptions()"
      ></bit-filter-menu>
    }
  </bit-table-toolbar>

  <bit-status-lockup slot="empty" class="tw-my-auto" size="small">
    <span slot="title">{{ "noItemsMatchSearch" | i18n }}</span>
    <button
      slot="button"
      type="button"
      bitButton
      buttonType="secondary"
      id="health-passkeys-list_button_clear-search"
      (click)="clearFilters()"
    >
      {{ "clearSearch" | i18n }}
    </button>
  </bit-status-lockup>

  <bit-column>
    <bit-header-cell>{{ "name" | i18n }}</bit-header-cell>
    <bit-cell *bitCellDef="table.columns.name; let row">
      <button
        type="button"
        data-fvw-target
        [attr.data-health-list-row]="row.id"
        [attr.aria-label]="
          'viewItemTitleWithField' | i18n: row.name : row.secondary ?? ('noUsername' | i18n)
        "
        (click)="open.emit(row)"
        class="tw-flex tw-items-center tw-gap-2 tw-w-full tw-min-w-0 tw-p-0 tw-bg-transparent tw-border-0 tw-text-start tw-text-main tw-cursor-pointer focus-visible:tw-outline-none"
      >
        <div class="tw-justify-start tw-w-7 tw-flex tw-shrink-0">
          <app-vault-icon [cipher]="row.cipher"></app-vault-icon>
        </div>
        <div class="tw-flex tw-flex-col tw-flex-1 tw-min-w-0">
          <span bitTypography="body2" class="tw-truncate tw-min-w-0">{{ row.name }}</span>
          <span class="tw-text-muted tw-text-xs tw-truncate">{{
            row.secondary ?? ("noUsername" | i18n)
          }}</span>
        </div>
      </button>
      @if (row.setUpUrl) {
        <div slot="end" class="tw-flex tw-items-center tw-shrink-0 tw-relative tw-z-10">
          <button
            type="button"
            bitLink
            linkType="primary"
            [id]="'health-passkeys-list_button_set-up-' + row.id"
            [attr.aria-label]="'setUpPasskeyFor' | i18n: row.name"
            (click)="setUp.emit(row)"
          >
            {{ "setUpPasskey" | i18n }}
          </button>
        </div>
      }
    </bit-cell>
  </bit-column>

  <bit-row-group collapsible [match]="isLogin" [description]="'passkeyLoginGroupDesc' | i18n">
    {{ "passkeyLoginGroup" | i18n }}
  </bit-row-group>
  <bit-row-group collapsible [match]="isTwoStep" [description]="'passkeyTwoStepGroupDesc' | i18n">
    {{ "passkeyTwoStepGroup" | i18n }}
  </bit-row-group>
</bit-table-v2>
