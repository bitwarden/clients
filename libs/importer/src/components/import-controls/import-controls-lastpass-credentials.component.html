<ng-container [formGroup]="form()">
  <bit-form-field class="tw-max-w-sm">
    <bit-label>{{ "lastPassEmail" | i18n }}</bit-label>
    <input
      bitInput
      type="text"
      formControlName="lastPassEmail"
      id="importer-controls_input_lastpass-email"
    />
  </bit-form-field>
  <bit-form-control [disableMargin]="true">
    <input
      bitCheckbox
      type="checkbox"
      formControlName="includeSharedFolders"
      id="importer-controls_input_include-shared-folders"
    />
    <bit-label>{{ "includeSharedFolders" | i18n }}</bit-label>
  </bit-form-control>
</ng-container>
