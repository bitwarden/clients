<bit-card data-testid="cipher-view-banner-unavailable">
  <div class="tw-flex tw-flex-col tw-gap-4">
    <app-pam-banner-card-header [icon]="badgeLook.unavailable.icon" variant="gray">
      <span slot="title">
        {{ (slotTaken() ? "pamSlotTakenHeading" : "pamUnavailableBannerHeading") | i18n }}
      </span>
      <span slot="description">
        {{ (slotTaken() ? "pamSlotTakenRequestLaterBody" : "pamUnavailableBannerBody") | i18n }}
      </span>
    </app-pam-banner-card-header>
    <ng-content />
  </div>
</bit-card>
