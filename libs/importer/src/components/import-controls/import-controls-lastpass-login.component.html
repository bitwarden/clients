<ng-container [formGroup]="form">
  <ng-template #waiting let-title="title" let-body="body">
    <div
      class="tw-flex tw-flex-col tw-items-center tw-gap-2 tw-py-4 tw-text-center"
      role="status"
      tabindex="-1"
    >
      <bit-spinner size="base" class="tw-mb-1" />
      @if (title) {
        <p bitTypography="body1" class="tw-font-semibold" noMargin>{{ title | i18n }}</p>
      }
      <p bitTypography="body1" noMargin>{{ body | i18n }}</p>
    </div>
  </ng-template>

  @switch (stage().kind) {
    @case ("loading") {
      <ng-container
        *ngTemplateOutlet="waiting; context: { title: null, body: 'importingYourAccount' }"
      />
    }
    @case ("importing") {
      <ng-container
        *ngTemplateOutlet="waiting; context: { title: null, body: 'importingYourAccount' }"
      />
    }
    @case ("sso") {
      <ng-container
        *ngTemplateOutlet="
          waiting;
          context: { title: 'lastPassLoginWaitingForSso', body: 'lastPassLoginWaitingForSsoDesc' }
        "
      />
    }
    @case ("password") {
      <bit-form-field class="tw-max-w-sm">
        <bit-label>{{ "masterPassword" | i18n }}</bit-label>
        <input
          bitInput
          type="password"
          formControlName="lastPassPassword"
          appInputVerbatim
          id="importer-controls_input_lastpass-password"
        />
        <button type="button" bitSuffix bitIconButton bitPasswordInputToggle></button>
      </bit-form-field>
    }
    @case ("code") {
      <bit-form-field class="tw-max-w-sm">
        <bit-label>{{ "verificationCode" | i18n }}</bit-label>
        <input
          bitInput
          type="text"
          formControlName="lastPassCode"
          appInputVerbatim
          id="importer-controls_input_lastpass-code"
        />
      </bit-form-field>
    }
  }
</ng-container>
