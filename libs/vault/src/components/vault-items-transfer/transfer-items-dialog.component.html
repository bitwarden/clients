<bit-simple-dialog>
  <span bitDialogTitle>{{ "transferYourItemsToOrganizationTitle" | i18n: organizationName }}</span>

  <span bitDialogContent>
    <p>
      {{ "transferItemsToOrganizationRequiredDescription" | i18n: organizationName }}
    </p>
    <p class="tw-mb-0">
      <a
        bitLink
        href="#"
        (click)="openLearnMore($event)"
        endIcon="bwi-external-link"
        [aria-label]="'openTransferItemsHelpArticle' | i18n"
      >
        {{ "learnMore" | i18n }}
      </a>
    </p>
  </span>

  <ng-container bitDialogFooter>
    <button bitButton type="button" buttonType="primary" (click)="acceptTransfer()">
      {{ "acceptTransfer" | i18n }}
    </button>

    <button bitButton type="button" buttonType="secondary" (click)="decline()">
      {{ "declineAndLeave" | i18n }}
    </button>
  </ng-container>
</bit-simple-dialog>
