<popup-page>
  <popup-header slot="header" [pageTitle]="'health' | i18n">
    <ng-container slot="end">
      <app-pop-out />
      <app-current-account />
    </ng-container>
  </popup-header>
  @if (!hasRunHealthScan()) {
    <health-intro (onTriggerHealthScan)="handleHealthScan()" />
  } @else if (report(); as report) {
    <!-- Results first: a failed refresh must not throw away a report the user
         is already looking at. The failure view is for having nothing to show. -->
    <dirt-health-overview [report]="report" />
  } @else if (scanFailed()) {
    <dirt-health-scan-error />
  } @else {
    <dirt-health-scanning />
  }
</popup-page>
