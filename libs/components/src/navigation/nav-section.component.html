@let open = sideNavService.open();

<div role="group" [attr.aria-labelledby]="labelId">
  <div
    [id]="labelId"
    class="tw-flex tw-items-center tw-gap-1 tw-px-6 tw-pt-1 tw-mb-0.5 tw-text-xs tw-font-semibold tw-uppercase tw-tracking-[1px] tw-text-fg-nav-heading"
    [class.tw-sr-only]="!open"
  >
    @if (icon()) {
      <bit-icon [name]="icon()"></bit-icon>
    }
    <span>{{ label() }}</span>
  </div>
  <div class="tw-flex tw-flex-col tw-gap-0.5">
    <ng-content></ng-content>
  </div>
</div>
