@let open = sideNavService.open();
@let heading = label();

<div [attr.role]="heading ? 'group' : null" [attr.aria-labelledby]="heading ? labelId : null">
  @if (heading) {
    <div
      [id]="labelId"
      class="tw-flex tw-items-center tw-gap-1 tw-pe-3 tw-pt-1 tw-mb-0.5 tw-text-xs tw-font-semibold tw-uppercase tw-tracking-[1px] tw-text-fg-nav-heading"
      [class.tw-ps-2]="!isInNavGroup"
      [class.tw-ps-3]="isInNavGroup"
      [class.tw-sr-only]="!open"
    >
      @if (icon()) {
        <bit-icon class="tw-text-base/none" [name]="icon()"></bit-icon>
      }
      <span>{{ heading }}</span>
    </div>
  }
  <div class="tw-flex tw-flex-col tw-gap-0.5">
    <ng-content></ng-content>
  </div>
</div>
