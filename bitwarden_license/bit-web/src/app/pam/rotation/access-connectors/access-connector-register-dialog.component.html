<form [formGroup]="form" [bitSubmit]="submit" bit-dialog dialogSize="default">
  <ng-container bitDialogTitle>
    {{ "pamAccessConnectorRegisterTitle" | i18n }}
  </ng-container>

  <div bitDialogContent>
    <p bitTypography="body1" class="tw-text-fg-body">
      {{ "pamAccessConnectorRegisterDescription" | i18n }}
    </p>
    <bit-form-field disableMargin>
      <bit-label>{{ "name" | i18n }}</bit-label>
      <input bitInput formControlName="name" id="access-connector-register-dialog_input_name" />
      <bit-hint>{{ "pamAccessConnectorNameRecognizableHint" | i18n }}</bit-hint>
    </bit-form-field>
  </div>

  <ng-container bitDialogFooter>
    <button
      type="submit"
      bitButton
      buttonType="primary"
      bitFormButton
      id="access-connector-register-dialog_button_submit"
    >
      {{ "pamAccessConnectorRegister" | i18n }}
    </button>
    <button
      type="button"
      bitButton
      buttonType="secondary"
      bitFormButton
      (click)="cancel()"
      id="access-connector-register-dialog_button_cancel"
    >
      {{ "cancel" | i18n }}
    </button>
  </ng-container>
</form>
