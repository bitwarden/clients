<app-header *ngIf="project$ | async as project" [title]="project.name" icon="bwi-collection">
  <bit-breadcrumbs slot="breadcrumbs">
    <bit-breadcrumb [route]="['..']" icon="bwi-angle-left">{{ "projects" | i18n }}</bit-breadcrumb>
  </bit-breadcrumbs>
  <bit-tab-nav-bar label="Main" slot="tabs">
    <bit-tab-link [route]="['secrets']">
      {{ "secrets" | i18n }}
      <div slot="end" class="tw-text-muted">
        {{ projectCounts?.secrets }}
      </div>
    </bit-tab-link>
    <ng-container *ngIf="project.write">
      <bit-tab-link [route]="['people']">
        {{ "people" | i18n }}
        <div slot="end" class="tw-text-muted">
          {{ projectCounts?.people }}
        </div>
      </bit-tab-link>
      <bit-tab-link [route]="['machine-accounts']">
        {{ "machineAccounts" | i18n }}
        <div slot="end" class="tw-text-muted">
          {{ projectCounts?.serviceAccounts }}
        </div>
      </bit-tab-link>
    </ng-container>
  </bit-tab-nav-bar>
  <!-- These branches must stay flat: `slot` is matched at compile time and only one level of
       control flow is looked into, so nesting these inside another block sends the button to the
       default slot. Remove the `@else` branch along with the VFO1 flag. -->
  @if (project.write && vfo1Enabled()) {
    <button type="button" bitButton buttonType="secondary" (click)="openEditDialog()">
      {{ "editProject" | i18n }}
    </button>
  } @else if (project.write) {
    <button
      slot="secondary"
      type="button"
      bitButton
      buttonType="secondary"
      (click)="openEditDialog()"
    >
      {{ "editProject" | i18n }}
    </button>
  }
  <sm-new-menu></sm-new-menu>
</app-header>
<router-outlet></router-outlet>
