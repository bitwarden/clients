<div
  class="tw-flex tw-h-full tw-flex-col tw-items-center tw-justify-center tw-px-6 tw-text-center"
  role="status"
  aria-live="polite"
>
  <h2 bitTypography="body1" class="tw-mb-3 tw-font-semibold tw-text-fg-heading">
    {{ "scanningYourVault" | i18n }}
  </h2>

  <div class="tw-w-full">
    <bit-progress-bar
      [value]="progress()"
      [hideStartHint]="true"
      [accessibleName]="'scanningYourVault' | i18n"
      [ariaValueText]="'scanningYourVault' | i18n"
    />
  </div>

  <p bitTypography="body2" class="tw-mb-0 tw-mt-3 tw-text-fg-body-subtle">
    {{ "scanningYourVaultDescription" | i18n }}
  </p>
</div>
