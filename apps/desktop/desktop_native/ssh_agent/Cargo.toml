[package]
name = "ssh_agent"
edition = { workspace = true }
license = { workspace = true }
version = { workspace = true }
publish = { workspace = true }

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
mockall = { workspace = true }
rkyv = "=0.8.17"
# rsa, sha2 and signature track the majors that ssh-key 0.7 builds on; mixing majors makes the
# `RsaKeypair` -> `SigningKey` conversions and the `Signer`/`Verifier` traits unavailable.
rsa = "=0.10.0"
secure_memory = { path = "../secure_memory" }
sha2 = "=0.11.0"
signature = "=3.0.0"
# ssh-key, and its ssh-encoding/ssh-cipher dependencies, are redirected to a fork by
# `[patch.crates-io]` in the workspace manifest, for the `mldsa-eddsa` composite key type.
ssh-key = { version = "=0.7.0-rc.12", features = [
    "encryption",
    "ed25519",
    "mldsa-eddsa",
    "p256",
    "p384",
    "p521",
    "rsa",
    "rand_core",
] }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
homedir = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
] }

[dev-dependencies]
bitwarden-random = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
mockall = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
mockall = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
